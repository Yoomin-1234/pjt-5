{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-center">
    <form action="{% url 'analyze' %}" method="GET" class="w-50 d-flex gap-2">
        <input type="text" name="company_name" class="form-control" placeholder="회사 이름 입력 (예: 삼성전자)" required>
        <button type="submit" class="btn btn-primary text-nowrap">검색</button>
    </form>
</div>
<p class="text-center text-muted mt-3 small">
    ※ 회사명을 입력하고 검색 버튼을 누르면 실시간으로 데이터를 수집합니다.
</p>
{% endblock content %}
