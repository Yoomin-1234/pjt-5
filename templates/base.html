<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>댓글 증강 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container bg-white p-5 rounded-4 shadow-sm" style="max-width: 1400px;">
    <a href="{% url 'stocks:index' %}" class="text-decoration-none">
      <h2 class="text-center text-primary fw-bold mb-4">📈 댓글 증강 시스템</h2>
    </a>

    <!-- F611: 검색 결과 없음 / 댓글 없음 예외 상태 메시지 출력 -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-warning alert-dismissible fade show text-center" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock content %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
