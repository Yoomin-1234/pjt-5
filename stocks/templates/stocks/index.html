{% extends "base.html" %}

{% block content %}
  <div class="card border-0 bg-light p-4 mb-4">
    <form action="{% url 'stocks:index' %}" method="GET" class="d-flex justify-content-center align-items-center gap-2">
      <label for="company_name" class="fw-bold me-2 text-nowrap">회사 이름 입력:</label>
      <input
        type="text"
        id="company_name"
        name="company_name"
        value="{{ searched_name|default:'' }}"
        class="form-control w-50"
        placeholder="예: 삼성전자"
      >
      <button type="submit" class="btn btn-primary px-4 text-nowrap">검색</button>
    </form>
    <p class="text-center text-muted small mt-2 mb-0">
      회사명은 일부만 입력해도 됩니다. (가장 상단 검색 결과를 자동 선택)
    </p>
  </div>
{% endblock content %}
